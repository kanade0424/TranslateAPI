name: Release

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: my-app-linux
            file_extension: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: my-app-windows.exe
            file_extension: ".exe"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}

      - name: Build Release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare Artifact
        shell: bash
        run: |
          mkdir -p staging
          # 実際のCargo.tomlのパッケージ名に合わせて "my_app" を変更してください
          cp target/${{ matrix.target }}/release/my_app${{ matrix.file_extension }} staging/${{ matrix.artifact_name }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ matrix.os }}
          path: staging/

  release:
    name: Create/Update Draft Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts

      - name: Create or Update Draft Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: nightly-release
          name: "Development Draft Release"
          draft: true
          prerelease: true
          files: |
            downloaded-artifacts/artifact-ubuntu-latest/*
            downloaded-artifacts/artifact-windows-latest/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}